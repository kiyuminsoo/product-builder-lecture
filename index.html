<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테스트 공방 - 당신의 아이디어를 현실로</title>
    <meta name="description" content="테스트 공방에서 기발하고 재미있는 아이디어를 AI 기술로 구현합니다. 로또 예측, 얼굴상 분석, 가상 대화 시뮬레이터 등 다양한 실험을 경험하세요.">
    <meta name="google-adsense-account" content="ca-pub-3309850697417776">
    <link rel="stylesheet" href="style.css">
    <!-- Premium Wavy Filter (no text-splitting, keeps spacing intact) -->
<script data-apple-dark-motion>
(function(){
  const root = document.documentElement;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- pointer glow (subtle)
  if (!reduce) {
    let raf = 0;
    window.addEventListener("pointermove", (e) => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;
        root.style.setProperty("--mx", x + "%");
        root.style.setProperty("--my", y + "%");
        raf = 0;
      });
    }, { passive: true });
  }

  // ---- scroll progress (for gradient shift)
  if (!reduce) {
    let raf2 = 0;
    const onScroll = () => {
      if (raf2) return;
      raf2 = requestAnimationFrame(() => {
        const max = Math.max(1, document.body.scrollHeight - innerHeight);
        const p = Math.min(1, Math.max(0, scrollY / max));
        root.style.setProperty("--scroll", String(p));
        raf2 = 0;
      });
    };
    addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  } else {
    root.style.setProperty("--scroll", "0");
  }

  // ---- reveal (IntersectionObserver)
  const revealTargets = document.querySelectorAll("[data-reveal], .hero, #tools, header, footer");
  if (!reduce && revealTargets.length) {
    revealTargets.forEach(el => el.classList.add("reveal"));
    const io = new IntersectionObserver((entries) => {
      for (const ent of entries) {
        if (ent.isIntersecting) {
          ent.target.classList.add("is-in");
          io.unobserve(ent.target);
        }
      }
    }, { threshold: 0.18 });
    revealTargets.forEach(el => io.observe(el));
  } else {
    revealTargets.forEach(el => el.classList.add("is-in"));
  }

  // ---- tools cards micro-tilt (very light)
  if (!reduce) {
    const cards = document.querySelectorAll('#tools a, #tools .card, #tools li, #tools .tool');
    cards.forEach(card => {
      card.classList.add("tilt-card");
      let rAF = 0;
      const rectOf = () => card.getBoundingClientRect();

      const onMove = (e) => {
        if (rAF) return;
        rAF = requestAnimationFrame(() => {
          const r = rectOf();
          const px = (e.clientX - r.left) / Math.max(1, r.width);
          const py = (e.clientY - r.top) / Math.max(1, r.height);
          const rx = (py - 0.5) * -6;
          const ry = (px - 0.5) * 8;
          card.style.setProperty("--rx", rx.toFixed(2) + "deg");
          card.style.setProperty("--ry", ry.toFixed(2) + "deg");
          card.style.setProperty("--hx", (px*100).toFixed(1) + "%");
          card.style.setProperty("--hy", (py*100).toFixed(1) + "%");
          rAF = 0;
        });
      };
      const onLeave = () => {
        card.style.setProperty("--rx", "0deg");
        card.style.setProperty("--ry", "0deg");
      };
      card.addEventListener("pointermove", onMove, { passive: true });
      card.addEventListener("pointerleave", onLeave, { passive: true });
    });
  }

})();
</script>

</body>
</html>
